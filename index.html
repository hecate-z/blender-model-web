<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Blender 3D 模型展示</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 优先使用稳定的 jsdelivr CDN，兼容 GitHub Pages -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #f0f0f0; 
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* 加载/错误提示样式 */
        .status-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            border-radius: 8px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 16px;
            z-index: 9999;
            text-align: center;
        }
        .error {
            color: #ff4444;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="status" class="status-panel">模型加载中...</div>

    <script>
        // 全局状态管理
        const statusPanel = document.getElementById('status');
        let scene, camera, renderer, model;

        // 初始化函数（封装核心逻辑）
        function init() {
            try {
                // 1. 检查 Three.js 是否加载成功
                if (typeof THREE === 'undefined') {
                    throw new Error('Three.js 库加载失败，请检查网络或CDN链接');
                }

                // 2. 创建场景
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf0f0f0); // 背景色匹配页面

                // 3. 创建相机
                camera = new THREE.PerspectiveCamera(
                    75, 
                    window.innerWidth / window.innerHeight, 
                    0.1, 
                    1000
                );
                camera.position.z = 5;

                // 4. 创建渲染器
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true 
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.getElementById('canvas-container').appendChild(renderer.domElement);

                // 5. 添加光源（适配 GitHub Pages 展示）
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(3, 3, 4);
                scene.add(directionalLight);

                // 6. 加载 GLB 模型（替换为你的模型路径）
                loadModel('cube.glb'); // 若模型在子目录，写 './models/cube.glb'

                // 7. 窗口自适应
                window.addEventListener('resize', onWindowResize);

                // 8. 启动动画循环
                animate();

            } catch (error) {
                updateStatus(`初始化失败：${error.message}`, true);
                console.error('初始化错误:', error);
            }
        }

        // 模型加载函数
        function loadModel(modelPath) {
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                modelPath,
                (gltf) => {
                    model = gltf.scene;
                    // 模型适配：居中 + 缩放（根据实际模型调整）
                    model.position.set(0, 0, 0);
                    model.scale.set(1, 1, 1);
                    
                    scene.add(model);
                    updateStatus('模型加载完成！');
                    setTimeout(() => {
                        statusPanel.classList.add('hidden');
                    }, 1500);
                },
                (xhr) => {
                    const progress = (xhr.loaded / xhr.total * 100).toFixed(1);
                    updateStatus(`加载中：${progress}%`);
                },
                (error) => {
                    let errorMsg = '模型加载失败';
                    if (error.message.includes('404')) {
                        errorMsg = '模型文件不存在，请检查路径：' + modelPath;
                    } else if (error.message.includes('CORS')) {
                        errorMsg = '跨域错误，请确保模型文件和页面同域名';
                    }
                    updateStatus(errorMsg, true);
                    console.error('模型加载错误:', error);
                }
            );
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 模型旋转动画
            if (model) {
                model.rotation.y += 0.008; // 旋转速度适中
            }
            
            renderer.render(scene, camera);
        }

        // 窗口大小适配
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 更新状态提示
        function updateStatus(message, isError = false) {
            statusPanel.textContent = message;
            if (isError) {
                statusPanel.classList.add('error');
            } else {
                statusPanel.classList.remove('error');
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
