<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Blender 3D 模型展示</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 999;
            text-shadow: 0 0 5px #000;
        }
    </style>
    <!-- 修复：确保引入顺序正确，且使用兼容全局变量的 CDN 版本 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="loading">模型加载中...</div>
    <script>
        // 修复：显式检查 THREE 全局对象是否存在
        if (typeof THREE === 'undefined') {
            alert('Three.js 加载失败，请检查网络或 CDN 链接');
        }

        // 1. 初始化核心对象
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // 2. 光源设置
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // 3. 加载模型（修复：确保 GLTFLoader 正确实例化）
        let model = null;
        // 显式从 THREE 全局对象获取 GLTFLoader
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            // ！！！请替换为你的 cube.glb 实际路径（本地需用 Live Server 运行）
            'cube.glb',
            (gltf) => {
                model = gltf.scene;
                scene.add(model);
                model.position.set(0, 0, 0);
                model.scale.set(1, 1, 1);
                document.querySelector('.loading').style.display = 'none';
            },
            (xhr) => {
                const progress = (xhr.loaded / xhr.total * 100).toFixed(1);
                document.querySelector('.loading').textContent = `加载中：${progress}%`;
            },
            (err) => {
                console.error('模型加载失败:', err);
                document.querySelector('.loading').textContent = `加载失败：${err.message}`;
            }
        );

        // 4. 相机和动画
        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                model.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }
        animate();

        // 5. 窗口适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
